# Endy public status page — Upptime (https://upptime.js.org, MIT licence).
# SOURCE COPY. The live copy is the root .upptimerc.yml of the PUBLIC repo Endy-app/status
# (created from the upptime/upptime template). Edit here, then copy across.
#
# Public repo rule: nothing internal in this file. Probe only public hostnames; the database
# is reached through auth.endy.app (Supabase custom domain), never the project ref.
# SUPABASE_ANON_KEY is the public anon/publishable key (already shipped in the web bundle);
# it lives in the status repo's Actions secrets so it isn't committed.
owner: Endy-app
repo: status
user-agent: Endy-app

sites:
  - name: Website
    url: https://endy.app
    icon: https://endy.app/favicon.svg
  - name: Endy App
    url: https://app.endy.app
    icon: https://endy.app/favicon.svg
  - name: Sign-In
    url: https://auth.endy.app/auth/v1/health
    headers:
      - "apikey: $SUPABASE_ANON_KEY"
    icon: https://endy.app/favicon.svg
  - name: Database And API
    # The same trivial anon RPC the internal uptime probe uses (scripts/uptime-probe.mjs):
    # it goes through PostgREST to Postgres, so it fails when the database hangs.
    url: https://auth.endy.app/rest/v1/rpc/workspace_exists_by_slug
    method: POST
    headers:
      - "apikey: $SUPABASE_ANON_KEY"
      - "Authorization: Bearer $SUPABASE_ANON_KEY"
      - "Content-Type: application/json"
    body: '{"p_slug":"__uptime_probe__"}'
    maxResponseTime: 10000
    icon: https://endy.app/favicon.svg

secrets:
  - SUPABASE_ANON_KEY

# Upptime opens an issue per outage; these people are assigned.
assignees:
  - hiwebdivine

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * 0"
  updates: "0 3 * * *"

status-website:
  cname: status.endy.app
  name: Endy Status
  logoUrl: https://endy.app/icon-512.png
  favicon: https://endy.app/favicon.svg
  theme: dark
  introTitle: "**Endy** system status"
  introMessage: Live status of the Endy app, sign-in and database, checked every five minutes from outside Endy. Questions? Email hey@endy.app.
  navbar:
    - title: Status
      href: /
    - title: Endy
      href: https://endy.app
    - title: Docs
      href: https://endy.app/docs
